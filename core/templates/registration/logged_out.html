{% extends 'core/base.html' %}

{% block title %}Logged Out - WaterGo{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card dashboard-card">
            <div class="card-header">
                <h4 class="mb-0">Logged Out</h4>
            </div>
            <div class="card-body text-center">
                <div class="py-4">
                    <h5>You have been successfully logged out</h5>
                    <p class="text-muted">Thank you for using WaterGo!</p>
                </div>
                <div class="mt-3">
                    <a href="{% url 'login' %}" class="btn btn-primary">Log In Again</a>
                    <a href="{% url 'home' %}" class="btn btn-outline-secondary ms-2">Back to Home</a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
