{% extends 'core/base.html' %}

{% block title %}Driver Signup - WaterGo{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card dashboard-card">
            <div class="card-header">
                <h4 class="mb-0">Create Your Driver Account</h4>
            </div>
            <div class="card-body">
                <form method="post">
                    {% csrf_token %}
                    
                    <div class="mb-3">
                        <label for="username" class="form-label">Username</label>
                        <input type="text" class="form-control" id="username" name="username" required>
                    </div>
                    
                    <div class="mb-3">
                        <label for="email" class="form-label">Email</label>
                        <input type="email" class="form-control" id="email" name="email" required>
                    </div>
                    
                    <div class="mb-3">
                        <label for="password" class="form-label">Password</label>
                        <input type="password" class="form-control" id="password" name="password" required>
                    </div>
                    
                    <div class="mb-3">
                        <label for="license_number" class="form-label">Driver License Number</label>
                        <input type="text" class="form-control" id="license_number" name="license_number" required>
                    </div>
                    
                    <div class="mb-3">
                        <label for="vehicle_info" class="form-label">Vehicle Information</label>
                        <input type="text" class="form-control" id="vehicle_info" name="vehicle_info" placeholder="Make, Model, Year, Color" required>
                    </div>
                    
                    <div class="mb-3">
                        <label for="phone" class="form-label">Phone Number</label>
                        <input type="text" class="form-control" id="phone" name="phone" required>
                    </div>
                    
                    <div class="d-grid">
                        <button type="submit" class="btn btn-primary">Sign Up as Driver</button>
                    </div>
                </form>
                
                <div class="mt-3 text-center">
                    <p>Already have an account? <a href="{% url 'login' %}">Log In</a></p>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
